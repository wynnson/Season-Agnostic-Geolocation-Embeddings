seed: 42

data:
  data_dir: "data"
  num_workers: 4

model:
  repository: "facebookresearch/dinov3" # for dinov2, specify facebookresearch/dinov2
  backbone: "dinov3_vits16"
  weights: "artifacts/weights/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"  # local checkpoint path; required for DINOv3 (gated download)
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

evaluation:
  mode: "frozen"  # frozen, trained, lora
  checkpoint_path: "artifacts/weights/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"
  batch_size: 32
  retrieval_chunk_size: 512
  patch_reranking:
    enabled: false
    top_k: 10
    alpha: .2
    batch_size: 16
    candidate_batch_size: 4

logging:
  log_every: 10
