seed: 42

data:
  data_dir: "data"
  num_workers: 4

model:
  repository: "facebookresearch/dinov2"
  backbone: "dinov2_vits14"  # ViT-S/14
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

evaluation:
  mode: "trained"  # frozen, trained, lora
  checkpoint_path: "artifacts/checkpoints/dinov2_vits14_geo_grl_best.pt"
  batch_size: 32
  retrieval_chunk_size: 512

logging:
  log_every: 10
