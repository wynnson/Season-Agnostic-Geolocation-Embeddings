seed: 42

# Dataset
data:
  data_dir: "data"
  num_workers: 4

# Model
model:
  repository: "facebookresearch/dinov3" # for dinov2, specify facebookresearch/dinov2
  backbone: "dinov3_vits16"
  weights: "artifacts/weights/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"  # local checkpoint path; required for DINOv3 (gated download)
  tuning: "frozen"  # frozen, lora, full
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  projection_head:
    architecture: "residual"  # mlp, residual, identity
    hidden_dim: 768
    embedding_dim: 384
    dropout: 0.0
  patch_attention:
    enabled: true
    hidden_dim: 128
    residual_scale_initialization: 0.001
    num_regions: 1
  salad:
    num_clusters: 8
    cluster_dim: 32
    token_dim: 128
    hidden_dim: 512
    dropout: 0.0
    sinkhorn_iterations: 3
  season_classifier:
    num_classes: 2
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules:
      - blocks.10.attn.qkv
      - blocks.10.attn.proj
      - blocks.11.attn.qkv
      - blocks.11.attn.proj

# Training
training:
  epochs: 100
  batch_size: 256
  learning_rate: .0001
  weight_decay: 0.01
  temperature: 0.07
  season_loss_weight: 0
  grl_scale: 0
  sampled_hard_negatives_per_anchor: 25
  retrieval_chunk_size: 512

# Optimizer
optimizer:
  name: "adamw"

scheduler:
  name: "cosine"
  min_learning_rate: 0.000001

# Checkpointing
checkpoint:
  output_dir: "artifacts/checkpoints"
  run_name: "dinov3_vits16_patch_attention_frozen_LORA_residual_hard_50_b256_sw_.5_grl_2"

# Logging
logging:
  log_every: 10
  tensorboard_dir: "artifacts/tensorboard"
