seed: 42

# Dataset
data:
  data_dir: "data"
  num_workers: 4

# Model
model:
  repository: "facebookresearch/dinov3" # for dinov2, specify facebookresearch/dinov2
  backbone: "dinov3_vits16"
  weights: "artifacts/weights/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"  # local checkpoint path; required for DINOv3 (gated download)
  tuning: "frozen"  # frozen, lora, full
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  projection_head:
    architecture: "mlp"  # mlp, residual
    hidden_dim: 768
    embedding_dim: 384
    dropout: 0.0
  season_classifier:
    num_classes: 2
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules: ["qkv", "proj"]

# Training
training:
  epochs: 75
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  temperature: 0.07
  season_loss_weight: 0.0
  grl_scale: 1.0
  sampled_hard_negatives_per_anchor: 3
  retrieval_chunk_size: 512

# Optimizer
optimizer:
  name: "adamw"

scheduler:
  name: "cosine"
  min_learning_rate: 0.000001

# Checkpointing
checkpoint:
  output_dir: "artifacts/checkpoints"
  run_name: "dinov3_vits16_geo_grl_w0.0_mlp"

# Logging
logging:
  log_every: 10
  tensorboard_dir: "artifacts/tensorboard"
