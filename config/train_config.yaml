seed: 42

# Dataset
data:
  data_dir: "data"
  num_workers: 4

# Model
model:
  repository: "facebookresearch/dinov2"
  backbone: "dinov2_vits14"
  tuning: "frozen"  # frozen, lora, full
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  projection_head:
    hidden_dim: 384
    embedding_dim: 256
    dropout: 0.0
  season_classifier:
    num_classes: 2
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules: ["qkv", "proj"]

# Training
training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  temperature: 0.07
  season_loss_weight: 0.1
  grl_scale: 1.0
  sampled_hard_negatives_per_anchor: 3
  retrieval_chunk_size: 512

# Optimizer
optimizer:
  name: "adamw"

# Checkpointing
checkpoint:
  output_dir: "artifacts/checkpoints"
  save_every: 5

# Logging
logging:
  log_every: 10
  tensorboard_dir: "artifacts/tensorboard"
